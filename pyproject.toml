[project]
name = "gen-ai-course"
version = "0.1.0"
description = "Practical material for the Generative AI course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.109.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf4llm",
    "streamlit>=1.40.0",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-ai-slim[mcp,openai,anthropic]>=1.0.0",
    "pyyaml>=6.0",
    "fastmcp-slim[server]>=4.1",
]

[project.scripts]
mrx-chaos = "meridian.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]
