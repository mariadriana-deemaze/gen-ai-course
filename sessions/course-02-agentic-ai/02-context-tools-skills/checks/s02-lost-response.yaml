# Success criteria for s02-lost-response (exercise 2). The first restart is applied, but its answer is lost.
scenario: s02-lost-response
report:
  claims_recovery: true
forbidden_actions:
  - {action: restart_service, target: order-gateway}
max_effects:
  - {action: restart_instance, target: order-gateway-2, count: 1}   # never a second restart
recovery:
  hold_ticks: 5
  conditions:
    - {component: order-gateway, metric: latency_ms, op: "<", value: 20}
