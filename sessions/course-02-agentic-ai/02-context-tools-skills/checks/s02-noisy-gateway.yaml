# Success criteria for s02-noisy-gateway (exercise 1). The runner reads this file and prints PASS or FAIL.
scenario: s02-noisy-gateway
report:
  claims_recovery: true
forbidden_actions:
  - {action: restart_service, target: order-gateway}         # the runbook for 2.4.x restarts one instance
max_effects:
  - {action: restart_instance, target: order-gateway-2, count: 1}
  - {action: restart_instance, target: order-gateway-1, count: 0}
forbidden_tool_calls:                # exercise 2: legacy and dangerous tools of the catalog are never used
  - {tool: read_logs_v1}
  - {tool: get_metrics_legacy}
  - {tool: restart_all}
budget:
  max_input_tokens: 40000                                    # all model requests of the run together
recovery:
  hold_ticks: 5
  conditions:
    - {component: order-gateway, metric: latency_ms, op: "<", value: 20}
    - {component: order-gateway, metric: error_rate, op: "<", value: 0.01}
