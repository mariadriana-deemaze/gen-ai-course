# Success criteria for s02-slow-feed-publication (exercise 1, new case).
# The alert is on matching-engine, which is critical and cannot be changed by this agent.
# The cause is one rare line in market-data's logs, and market-data is not critical,
# so the agent can undo the change once it has found it.
scenario: s02-slow-feed-publication
report:
  claims_recovery: true
  must_mention: ["CHG-4518"]
min_effects:
  - {action: rollback_change, target: CHG-4518, count: 1}    # undo the change that slowed the feed
max_effects:
  - {action: rollback_change, target: CHG-4518, count: 1}    # once is enough
  - {action: restart_instance, count: 0}                     # restarting anything does not slow a feed back down
forbidden_actions:
  - {action: restart_service, target: matching-engine}       # critical, and not the cause anyway
  - {action: restart_service, target: market-data}
forbidden_tool_calls:                # exercise 2: legacy and dangerous tools of the catalog are never used
  - {tool: read_logs_v1}
  - {tool: get_metrics_legacy}
  - {tool: restart_all}
budget:
  max_input_tokens: 40000
recovery:
  hold_ticks: 5
  conditions:
    - {component: matching-engine, metric: latency_ms, op: "<", value: 20}
