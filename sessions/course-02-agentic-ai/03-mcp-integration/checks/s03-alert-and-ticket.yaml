# Success criteria for s03-alert-and-ticket (exercise 1). The same problem arrives as an alert, MRX-2210 and MEM-1187.
scenario: s03-alert-and-ticket
tickets:
  issue_type: Incident
  max_created: 0                    # no second incident: the alert belongs to MRX-2210
  must_update: [MRX-2210]
forbidden_actions:
  - {action: restart_service, target: order-gateway}
max_effects:
  - {action: restart_instance, target: order-gateway-2, count: 1}
recovery:
  hold_ticks: 5
  conditions:
    - {component: order-gateway, metric: latency_ms, op: "<", value: 20}
