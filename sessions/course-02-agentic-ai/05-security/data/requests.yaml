  - {id: P06, role: first-line, action: rollback_change, target: CHG-4520, component: order-gateway, expect: deny, why: "First-line only restarts instances."}
  - {id: P07, role: on-call, action: restart_instance, target: order-gateway-2, component: order-gateway, expect: allow}
  - {id: P08, role: on-call, action: restart_service, target: order-gateway, component: order-gateway, expect: allow}
