  - {id: P03, role: first-line, action: restart_instance, target: matching-engine-1, component: matching-engine, critical: true, expect: deny}
  - {id: P04, role: first-line, action: restart_service, target: matching-engine, component: matching-engine, critical: true, approval: [approved, incident-manager, true], expect: deny, why: "An approval is not authorization."}
